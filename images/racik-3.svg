<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="j3 d3">
  <title id="j3">Hara mikro dilarutkan dulu</title>
  <desc id="d3">Hara mikro yang jumlahnya sangat sedikit dilarutkan lebih dulu dalam segelas
    air hangat sampai bening, baru dituang ke tangki B.</desc>
  <rect width="420" height="300" rx="14" fill="#f4f9f2"/>
  <text x="210" y="38" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#2d5a27" text-anchor="middle">Larutkan di gelas air hangat</text>

  <!-- uap -->
  <g fill="none" stroke="#bcd7c6" stroke-width="5" stroke-linecap="round">
    <path d="M150 108 q10 -16 0 -30 q-10 -14 0 -28"/>
    <path d="M186 100 q10 -16 0 -30 q-10 -14 0 -26"/>
    <path d="M222 108 q10 -16 0 -30 q-10 -14 0 -28"/>
  </g>

  <!-- gelas -->
  <path d="M136 128 H240 L228 248 a10 10 0 0 1 -10 9 H158 a10 10 0 0 1 -10 -9 Z" fill="#eef5f7" opacity=".9"/>
  <path d="M144 168 H232 L223 242 a8 8 0 0 1 -8 7 H161 a8 8 0 0 1 -8 -7 Z" fill="#f2c14e" opacity=".55"/>
  <path d="M136 128 H240 L228 248 a10 10 0 0 1 -10 9 H158 a10 10 0 0 1 -10 -9 Z" fill="none" stroke="#31414a" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#c98b1e" opacity=".8">
    <circle cx="168" cy="196" r="4"/><circle cx="196" cy="212" r="3"/><circle cx="182" cy="228" r="4"/>
    <circle cx="208" cy="190" r="3"/>
  </g>

  <!-- sachet mikro -->
  <g transform="translate(280 120)">
    <rect width="86" height="54" rx="9" fill="#7fb069"/>
    <rect width="86" height="14" rx="7" fill="#5f9a4d"/>
    <text x="43" y="42" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">MIKRO</text>
  </g>
  <path d="M296 186 q-14 22 -34 30" fill="none" stroke="#7fb069" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="8 7"/>
  <path d="M262 220 l14 -4 -4 14 Z" fill="#7fb069"/>

  <text x="210" y="288" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Besi kelat masuk tangki A, sisanya tangki B</text>
</svg>
