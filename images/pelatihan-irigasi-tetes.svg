<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 372" width="788" height="372" role="img" aria-labelledby="jdl des">
  <title id="jdl">Irigasi tetes</title>
  <desc id="des">Skema irigasi tetes dari kepala instalasi sampai penetes di tiap polybag.</desc>
