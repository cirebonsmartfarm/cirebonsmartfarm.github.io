<text x="30" y="40" class="j">Irigasi Tetes (Drip Irrigation)</text><text x="30" y="62" class="l">Nutrisi disalurkan lewat pipa induk, pipa cabang, lalu selang lateral, dan keluar setetes demi setetes di pangkal tiap tanaman.</text><rect x="34" y="120" width="128" height="150" rx="10" fill="#fff" stroke="#4a7c59" stroke-width="1.6"/><text x="98" y="146" class="s" text-anchor="middle">Kepala</text><text x="98" y="164" class="s" text-anchor="middle">Instalasi</text><circle cx="60" cy="188" r="4" fill="#7fb069"/><text x="72" y="192" class="k">Tangki A</text><circle cx="60" cy="209" r="4" fill="#7fb069"/><text x="72" y="213" class="k">Tangki B</text><circle cx="60" cy="230" r="4" fill="#7fb069"/><text x="72" y="234" class="k">pH turun/naik</text><circle cx="60" cy="251" r="4" fill="#7fb069"/><text x="72" y="255" class="k">Pompa + EC/pH</text><line x1="162" y1="196" x2="738" y2="196" stroke="#6b7280" stroke-width="7" stroke-linecap="round"/><text x="450" y="188" class="k" text-anchor="middle">pipa induk</text><line x1="236" y1="196" x2="236" y2="228" stroke="#6b7280" stroke-width="4"/><circle cx="236" cy="234" r="4" fill="#4a90d9"/><circle cx="236" cy="246" r="2.6" fill="#4a90d9" opacity="0.7"/><rect x="193" y="256" width="86" height="56" rx="7" fill="#c89b7b"/><rect x="193" y="256" width="86" height="12" rx="6" fill="#8b5a3c"/><g transform="translate(236.0,268.0)" stroke="#c89b7b" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.85"><path d="M0 0 C -2 11, -12 17, -24 34"/><path d="M0 0 C 2 11, 12 17, 24 34"/><path d="M0 0 L0 34"/><path d="M0 17 C -3 32, -8 32, -12 34"/></g><g transform="translate(236.0,258.0) scale(0.92)"><path d="M0 0 L0 -16" stroke="#4a7c59" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="-9" cy="-13" rx="9" ry="5" fill="#7fb069" transform="rotate(-18 -9 -13)"/><ellipse cx="9" cy="-13" rx="9" ry="5" fill="#7fb069" transform="rotate(18 9 -13)"/><ellipse cx="-6" cy="-21" rx="7.5" ry="4.2" fill="#a7c957" transform="rotate(-30 -6 -