<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 410" width="848" height="410" role="img" aria-labelledby="jdl des">
  <title id="jdl">Gejala penyakit ikan menurut letaknya</title>
  <desc id="des">Letak gejala pada tubuh ikan dan penyebab yang paling mungkin.</desc>
  <style>
    .j  { font: 700 19px 'Poppins', 'Segoe UI', sans-serif; fill: #2d5a27; }
    .s  { font: 600 13px 'Poppins', 'Segoe UI', sans-serif; fill: #4a7c59; }
    .l  { font: 500 11.5px 'Poppins', 'Segoe UI', sans-serif; fill: #2c3e2d; }
    .k  { font: 500 10px 'Poppins', 'Segoe UI', sans-serif; fill: #6b7280; }
    .tebal { font-weight: 700; }
  </style>
  <rect width="848" height="410" fill="#f8fffe" rx="14"/>
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a90d9"/></marker><marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d5a27"/></marker><marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
<text x="30" y="40" class="j">Membaca Gejala dari Letaknya di Tubuh Ikan</text><text x="30" y="62" class="l">Tempat gejala muncul sudah mempersempit kemungkinan penyebabnya, bahkan sebelum ada pemeriksaan lebih jauh.</text><g transform="translate(300.0,220.0) scale(1.00,1)"><path d="M-130.0 0 C -52.0 -67.7, 52.0 -67.7, 130.0 0 C 52.0 67.7, -52.0 67.7, -130.0 0 Z" fill="#cbd5e1"/><path d="M-119.6 0 L-187.2 -54.6 L-187.2 54.6 Z" fill="#cbd5e1"/><circle cx="78.0" cy="-17.5" r="13.0" fill="#fff"/></g><circle cx="238" cy="190" r="7" fill="none" stroke="#dc2626" stroke-width="2.4"/><line x1="230" y1="190" x2="258" y2="190" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="40" y="167" width="218" height="46" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.4"/><text x="54" y="186" class="k" style="font-weight:700">Mata menonjol</text><text x="54" y="202" class="k">Streptococcosis pada nila</text><circle cx="310" cy="176" r="7" fill="none" stroke="#2563eb" stroke-width="2.4"/><line x1="318" y1="176" x2="560" y2="176" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="560" y="153" width="218" height="46" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.4"/><text x="574" y="172" class="k" style="font-weight:700">Bintik putih</text><text x="574" y="188" class="k">Parasit bercak putih</text><circle cx="366" cy="226" r="7" fill="none" stroke="#dc2626" stroke-width="2.4"/><line x1="374" y1="226" x2="560" y2="226" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="560" y="203" width="218" height="46" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.4"/><text x="574" y="222" class="k" style="font-weight:700">Luka merah, sisik terangkat</text><text x="574" y="238" class="k">Aeromonas</text><circle cx="274" cy="264" r="7" fill="none" stroke="#7c3aed" stroke-width="2.4"/><line x1="266" y1="264" x2="258" y2="264" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="40" y="241" width="218" height="46" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="54" y="260" class="k" style="font-weight:700">Gumpalan seperti kapas</text><text x="54" y="276" class="k">Jamur Saprolegnia</text><circle cx="204" cy="232" r="7" fill="none" stroke="#f59e0b" stroke-width="2.4"/><line x1="196" y1="232" x2="258" y2="232" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="40" y="209" width="218" height="46" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.4"/><text x="54" y="228" class="k" style="font-weight:700">Insang pucat, ikan megap</text><text x="54" y="244" class="k">Cacing insang</text><rect x="30" y="330" width="788" height="60" rx="10" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><text x="52" y="352" class="s">Urutan pemeriksaan yang benar</text><text x="52" y="372" class="l">Ukur oksigen, amonia, nitrit, pH, dan suhu lebih dulu. Sebagian besar wabah adalah akibat air yang buruk, bukan sebabnya. Mengobati tanpa memperbaiki air hanya menunda kejadian berikutnya.</text></svg>
