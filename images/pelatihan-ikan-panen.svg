<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 394" width="848" height="394" role="img" aria-labelledby="jdl des">
  <title id="jdl">Urutan pekerjaan panen</title>
  <desc id="des">Empat tahap panen dari penghilangan bau lumpur sampai pengangkutan.</desc>
  <style>
    .j  { font: 700 19px 'Poppins', 'Segoe UI', sans-serif; fill: #2d5a27; }
    .s  { font: 600 13px 'Poppins', 'Segoe UI', sans-serif; fill: #4a7c59; }
    .l  { font: 500 11.5px 'Poppins', 'Segoe UI', sans-serif; fill: #2c3e2d; }
    .k  { font: 500 10px 'Poppins', 'Segoe UI', sans-serif; fill: #6b7280; }
    .tebal { font-weight: 700; }
  </style>
  <rect width="848" height="394" fill="#f8fffe" rx="14"/>
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a90d9"/></marker><marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d5a27"/></marker><marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
<text x="30" y="40" class="j">Panen Dimulai Beberapa Hari Sebelum Ikan Diangkat</text><text x="30" y="62" class="l">Dua tahap pertama menentukan mutu, dan keduanya tidak bisa dikerjakan di hari terakhir.</text><rect x="30" y="94" width="188" height="248" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><rect x="30" y="94" width="188" height="5" rx="2.5" fill="#2d5a27"/><circle cx="60" cy="128" r="15" fill="#2d5a27"/><text x="60" y="133" text-anchor="middle" style="font:700 14px Poppins,sans-serif;fill:#fff">1</text><text x="82" y="133" class="s">Buang bau lumpur</text><rect x="46" y="150" width="156" height="24" rx="12" fill="#2d5a27" opacity="0.14"/><text x="124" y="166" class="k" text-anchor="middle" style="font-weight:700">3 sampai 10 hari</text><text x="46" y="196" class="k">Air bersih mengalir,</text><text x="46" y="211" class="k">tanpa pakan sama sekali.</text><line x1="46" y1="240" x2="202" y2="240" stroke="#d7e4d9"/><text x="46" y="262" class="k" style="fill:#2d5a27">Uji dengan memasak</text><text x="46" y="277" class="k" style="fill:#2d5a27">satu ekor contoh.</text><g transform="translate(124.0,316.0) scale(1.00,1)"><path d="M-28.0 0 C -11.2 -14.6, 11.2 -14.6, 28.0 0 C 11.2 14.6, -11.2 14.6, -28.0 0 Z" fill="#2d5a27"/><path d="M-25.8 0 L-40.3 -11.8 L-40.3 11.8 Z" fill="#2d5a27"/><circle cx="16.8" cy="-3.8" r="2.8" fill="#fff"/></g><line x1="220.0" y1="218.0" x2="246.0" y2="218.0" stroke="#7fb069" stroke-width="2.2" stroke-linecap="round" marker-end="url(#p2)"/><rect x="235" y="94" width="188" height="248" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><rect x="235" y="94" width="188" height="5" rx="2.5" fill="#4a7c59"/><circle cx="265" cy="128" r="15" fill="#4a7c59"/><text x="265" y="133" text-anchor="middle" style="font:700 14px Poppins,sans-serif;fill:#fff">2</text><text x="287" y="133" class="s">Pemberokan</text><rect x="251" y="150" width="156" height="24" rx="12" fill="#4a7c59" opacity="0.14"/><text x="329" y="166" class="k" text-anchor="middle" style="font-weight:700">12 sampai 36 jam</text><text x="251" y="196" class="k">Mengosongkan usus agar</text><text x="251" y="211" class="k">air angkut tidak kotor.</text><line x1="251" y1="240" x2="407" y2="240" stroke="#d7e4d9"/><text x="251" y="262" class="k" style="fill:#2d5a27">Lebih dari 2 hari mulai</text><text x="251" y="277" class="k" style="fill:#2d5a27">menurunkan bobot.</text><g transform="translate(329.0,316.0) scale(1.00,1)"><path d="M-28.0 0 C -11.2 -14.6, 11.2 -14.6, 28.0 0 C 11.2 14.6, -11.2 14.6, -28.0 0 Z" fill="#4a7c59"/><path d="M-25.8 0 L-40.3 -11.8 L-40.3 11.8 Z" fill="#4a7c59"/><circle cx="16.8" cy="-3.8" r="2.8" fill="#fff"/></g><line x1="425.0" y1="218.0" x2="451.0" y2="218.0" stroke="#7fb069" stroke-width="2.2" stroke-linecap="round" marker-end="url(#p2)"/><rect x="440" y="94" width="188" height="248" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><rect x="440" y="94" width="188" height="5" rx="2.5" fill="#7fb069"/><circle cx="470" cy="128" r="15" fill="#7fb069"/><text x="470" y="133" text-anchor="middle" style="font:700 14px Poppins,sans-serif;fill:#fff">3</text><text x="492" y="133" class="s">Panen</text><rect x="456" y="150" width="156" height="24" rx="12" fill="#7fb069" opacity="0.14"/><text x="534" y="166" class="k" text-anchor="middle" style="font-weight:700">Pagi hari</text><text x="456" y="196" class="k">Turunkan air bertahap,</text><text x="456" y="211" class="k">basahi semua alat.</text><line x1="456" y1="240" x2="612" y2="240" stroke="#d7e4d9"/><text x="456" y="262" class="k" style="fill:#2d5a27">Sortir ukuran sekalian</text><text x="456" y="277" class="k" style="fill:#2d5a27">saat mengangkat.</text><g transform="translate(534.0,316.0) scale(1.00,1)"><path d="M-28.0 0 C -11.2 -14.6, 11.2 -14.6, 28.0 0 C 11.2 14.6, -11.2 14.6, -28.0 0 Z" fill="#7fb069"/><path d="M-25.8 0 L-40.3 -11.8 L-40.3 11.8 Z" fill="#7fb069"/><circle cx="16.8" cy="-3.8" r="2.8" fill="#fff"/></g><line x1="630.0" y1="218.0" x2="656.0" y2="218.0" stroke="#7fb069" stroke-width="2.2" stroke-linecap="round" marker-end="url(#p2)"/><rect x="645" y="94" width="188" height="248" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><rect x="645" y="94" width="188" height="5" rx="2.5" fill="#a7c957"/><circle cx="675" cy="128" r="15" fill="#a7c957"/><text x="675" y="133" text-anchor="middle" style="font:700 14px Poppins,sans-serif;fill:#fff">4</text><text x="697" y="133" class="s">Pengangkutan</text><rect x="661" y="150" width="156" height="24" rx="12" fill="#a7c957" opacity="0.14"/><text x="739" y="166" class="k" text-anchor="middle" style="font-weight:700">Sesuai jarak</text><text x="661" y="196" class="k">Beri aerasi, turunkan</text><text x="661" y="211" class="k">suhu air sedikit.</text><line x1="661" y1="240" x2="817" y2="240" stroke="#d7e4d9"/><text x="661" y="262" class="k" style="fill:#2d5a27">Makin jauh perjalanan,</text><text x="661" y="277" class="k" style="fill:#2d5a27">makin renggang muatan.</text><g transform="translate(739.0,316.0) scale(1.00,1)"><path d="M-28.0 0 C -11.2 -14.6, 11.2 -14.6, 28.0 0 C 11.2 14.6, -11.2 14.6, -28.0 0 Z" fill="#a7c957"/><path d="M-25.8 0 L-40.3 -11.8 L-40.3 11.8 Z" fill="#a7c957"/><circle cx="16.8" cy="-3.8" r="2.8" fill="#fff"/></g><text x="30" y="374" class="l">Bau lumpur berasal dari senyawa geosmin yang masuk lewat insang dan menumpuk di lemak ikan. Ia tidak bisa dicuci, hanya bisa dikeluarkan ikan itu sendiri di air bersih.</text></svg>
