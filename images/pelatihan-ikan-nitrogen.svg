<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 468" width="848" height="468" role="img" aria-labelledby="jdl des">
  <title id="jdl">Tiga jalur nitrogen di kolam</title>
  <desc id="des">Skema jalur alga, nitrifikasi, dan heterotrof dalam mengelola amonia.</desc>
  <style>
    .j  { font: 700 19px 'Poppins', 'Segoe UI', sans-serif; fill: #2d5a27; }
    .s  { font: 600 13px 'Poppins', 'Segoe UI', sans-serif; fill: #4a7c59; }
    .l  { font: 500 11.5px 'Poppins', 'Segoe UI', sans-serif; fill: #2c3e2d; }
    .k  { font: 500 10px 'Poppins', 'Segoe UI', sans-serif; fill: #6b7280; }
    .tebal { font-weight: 700; }
  </style>
  <rect width="848" height="468" fill="#f8fffe" rx="14"/>
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a90d9"/></marker><marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d5a27"/></marker><marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
<text x="30" y="40" class="j">Tiga Jalan Amonia Meninggalkan Kolam</text><text x="30" y="62" class="l">Ketiganya bekerja bersamaan di setiap kolam. Yang Anda pilih menentukan seberapa besar campur tangan harian yang diperlukan.</text><rect x="30" y="96" width="176" height="96" rx="12" fill="#fff" stroke="#4a7c59" stroke-width="1.8"/><text x="118" y="122" class="s" text-anchor="middle">Pakan masuk</text><text x="118" y="144" class="k" text-anchor="middle">Sekitar seperempat</text><text x="118" y="158" class="k" text-anchor="middle">menjadi daging ikan.</text><text x="118" y="176" class="k" text-anchor="middle" style="font-weight:700">Sisanya jadi amonia.</text><g transform="translate(118.0,216.0) scale(1.00,1)"><path d="M-29.0 0 C -11.6 -15.1, 11.6 -15.1, 29.0 0 C 11.6 15.1, -11.6 15.1, -29.0 0 Z" fill="#7fb069"/><path d="M-26.7 0 L-41.8 -12.2 L-41.8 12.2 Z" fill="#7fb069"/><circle cx="17.4" cy="-3.9" r="2.9" fill="#fff"/></g><text x="118" y="248" class="k" text-anchor="middle">amonia di dalam air</text><line x1="214.0" y1="168.0" x2="268.0" y2="140.0" stroke="#a7c957" stroke-width="2.4" stroke-linecap="round" marker-end="url(#p2)"/><rect x="272" y="96" width="330" height="106" rx="12" fill="#fff" stroke="#a7c957" stroke-width="1.8"/><rect x="272" y="96" width="330" height="4" rx="2" fill="#a7c957"/><text x="292" y="122" class="s">Alga</text><text x="292" y="142" class="k">Fitoplankton menyerap amonia</text><text x="292" y="156" class="k">sebagai pupuk lalu tumbuh.</text><text x="292" y="170" class="k">Berhenti saat malam, dan bisa</text><text x="292" y="184" class="k">runtuh mendadak bersama-sama.</text><rect x="618" y="126" width="196" height="46" rx="8" fill="#a7c957" opacity="0.14"/><text x="716" y="148" class="k" text-anchor="middle" style="font-weight:600">Butuh</text><text x="716" y="162" class="k" text-anchor="middle">cahaya matahari</text><line x1="214.0" y1="168.0" x2="268.0" y2="260.0" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" marker-end="url(#p2)"/><rect x="272" y="216" width="330" height="106" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><rect x="272" y="216" width="330" height="4" rx="2" fill="#2563eb"/><text x="292" y="242" class="s">Bakteri nitrifikasi</text><text x="292" y="262" class="k">Mengubah amonia menjadi nitrit</text><text x="292" y="276" class="k">lalu nitrat yang jauh lebih aman.</text><text x="292" y="290" class="k">Mapan setelah enam sampai tujuh</text><text x="292" y="304" class="k">minggu, tetapi lalu mandiri.</text><rect x="618" y="246" width="196" height="46" rx="8" fill="#2563eb" opacity="0.14"/><text x="716" y="268" class="k" text-anchor="middle" style="font-weight:600">Butuh</text><text x="716" y="282" class="k" text-anchor="middle">oksigen dan alkalinitas</text><line x1="214.0" y1="168.0" x2="268.0" y2="380.0" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#p2)"/><rect x="272" y="336" width="330" height="106" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="1.8"/><rect x="272" y="336" width="330" height="4" rx="2" fill="#f59e0b"/><text x="292" y="362" class="s">Bakteri heterotrof</text><text x="292" y="382" class="k">Menyerap amonia langsung menjadi</text><text x="292" y="396" class="k">protein tubuhnya, itulah flok.</text><text x="292" y="410" class="k">Bekerja dalam hitungan jam, dan</text><text x="292" y="424" class="k">floknya bisa dimakan ikan lagi.</text><rect x="618" y="366" width="196" height="46" rx="8" fill="#f59e0b" opacity="0.14"/><text x="716" y="388" class="k" text-anchor="middle" style="font-weight:600">Butuh</text><text x="716" y="402" class="k" text-anchor="middle">sumber karbon tiap hari</text><rect x="30" y="284" width="220" height="128" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><text x="48" y="308" class="s">Bioflok memilih jalur</text><text x="48" y="326" class="s" style="fill:#f59e0b">yang ketiga</text><text x="48" y="350" class="k">Karena itu kolam bioflok</text><text x="48" y="366" class="k">selalu perlu tambahan karbon</text><text x="48" y="382" class="k">seperti molase, dan aerasi</text><text x="48" y="398" class="k">yang tidak boleh berhenti.</text><text x="30" y="446" class="l">Rasio karbon terhadap nitrogen yang dituju 12 sampai 15 banding 1. Kurang dari itu, bakteri tidak sanggup menyerap seluruh amonianya.</text></svg>
