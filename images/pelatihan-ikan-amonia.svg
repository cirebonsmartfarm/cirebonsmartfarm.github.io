<text x="30" y="40" class="j">Bagian Amonia yang Beracun Naik Tajam Bersama pH</text><text x="30" y="62" class="l">Alat uji Anda mengukur amonia total. Yang membunuh ikan hanya bagian yang berbentuk NH3 bebas, dan besarnya ditentukan pH serta suhu.</text><line x1="92" y1="350" x2="562" y2="350" stroke="#6b7280" stroke-width="1.6"/><line x1="92" y1="350" x2="92" y2="100" stroke="#6b7280" stroke-width="1.6"/><line x1="92" y1="350.0" x2="562" y2="350.0" stroke="#d7e4d9" stroke-width="1" stroke-dasharray="2 4"/><text x="84" y="354.0" class="k" text-anchor="end">0%</text><line x1="92" y1="300.0" x2="562" y2="300.0" stroke="#d7e4d9" stroke-width="1" stroke-dasharray="2 4"/><text x="84" y="304.0" class="k" text-anchor="end">10%</text><line x1="92" y1="250.0" x2="562" y2="250.0" stroke="#d7e4d9" stroke-width="1" stroke-dasharray="2 4"/><text x="84" y="254.0" class="k" text-anchor="end">20%</text><line x1="92" y1="200.0" x2="562" y2="200.0" stroke="#d7e4d9" stroke-width="1" stroke-dasharray="2 4"/><text x="84" y="204.0" class="k" text-anchor="end">30%</text><line x1="92" y1="150.0" x2="562" y2="150.0" stroke="#d7e4d9" stroke-width="1" stroke-dasharray="2 4"/><text x="84" y="154.0" class="k" text-anchor="end">40%</text><line x1="92" y1="100.0" x2="562" y2="100.0" stroke="#d7e4d9" stroke-width="1" stroke-dasharray="2 4"/><text x="84" y="104.0" class="k" text-anchor="end">50%</text><line x1="92.0" y1="350" x2="92.0" y2="355" stroke="#6b7280" stroke-width="1"/><text x="92.0" y="370" class="k" text-anchor="middle">6,5</text><line x1="186.0" y1="350" x2="186.0" y2="355" stroke="#6b7280" stroke-width="1"/><text x="186.0" y="370" class="k" text-anchor="middle">7,0</text><line x1="280.0" y1="350" x2="280.0" y2="355" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="370" class="k" text-anchor="middle">7,5</text><line x1="374.0" y1="350" x2="374.0" y2="355" stroke="#6b7280" stroke-width="1"/><text x="374.0" y="370" class="k" text-anchor="middle">8,0</text><line x1="468.0" y1="350" 