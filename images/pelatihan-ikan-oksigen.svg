eight="16" rx="8" fill="#c89b7b"/><text x="588" y="252" class="k" style="font-weight:700">Bahan organik dasar</text><text x="588" y="290" class="k">sisa pakan dan flok mati</text><rect x="588" y="320" width="60" height="16" rx="8" fill="#a7c957"/><text x="588" y="314" class="k" style="font-weight:700">Alga saat malam</text><text x="588" y="352" class="k">siang memberi, malam memakai</text><text x="30" y="428" class="l">Pada kolam bioflok yang matang, bakteri sering memakai oksigen sebanyak atau lebih banyak daripada ikannya.</text><text x="30" y="448" class="l">Menghitung aerasi dari jumlah ikan saja adalah kesalahan yang paling sering berakibat fatal.</text></svg>
