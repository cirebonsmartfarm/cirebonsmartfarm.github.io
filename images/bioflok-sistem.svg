<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 0 1130 640" role="img"
     aria-labelledby="judulSistem descSistem">
  <title id="judulSistem">Anatomi kolam bioflok</title>
  <desc id="descSistem">Potongan melintang kolam bioflok bundar: rangka wiremesh, terpal HDPE,
    air berisi flok, aerasi 24 jam dari blower dan batu aerasi, pembuangan sentral, serta
    atap paranet peneduh.</desc>

  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8bf"/>
      <stop offset="1" stop-color="#255f76"/>
    </linearGradient>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbf6"/>
      <stop offset="1" stop-color="#e6f2e4"/>
    </linearGradient>
    <g id="nila">
      <ellipse cx="0" cy="0" rx="26" ry="11" fill="#e8f3ee" opacity=".95"/>
      <path d="M-24 0 L-40 -11 L-40 11 Z" fill="#e8f3ee" opacity=".95"/>
      <path d="M-6 -10 L10 -18 L16 -9 Z" fill="#cfe3d8" opacity=".95"/>
      <circle cx="16" cy="-2" r="2.6" fill="#255f76"/>
    </g>
  </defs>

  <rect x="-130" y="0" width="1130" height="640" fill="url(#langit)"/>

  <!-- atap paranet -->
  <g stroke="#4a7c59" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M150 118 L470 66 L790 118"/>
    <path d="M186 112 L186 196" stroke-width="7"/>
    <path d="M754 112 L754 196" stroke-width="7"/>
  </g>
  <path d="M150 118 L470 66 L790 118 L470 96 Z" fill="#7fb069" opacity=".35"/>

  <!-- tanah -->
  <path d="M60 546 H940" stroke="#8a6a4a" stroke-width="7" stroke-linecap="round"/>
  <rect x="60" y="546" width="880" height="26" fill="#cbb79c" opacity=".55"/>

  <!-- dinding kolam -->
  <path d="M200 196 H740 V520 a24 24 0 0 1 -24 26 H224 a24 24 0 0 1 -24 -26 Z"
        fill="#31414a"/>
  <path d="M214 210 H726 V516 a16 16 0 0 1 -16 16 H230 a16 16 0 0 1 -16 -16 Z"
        fill="url(#air)"/>

  <!-- garis wiremesh -->
  <g stroke="#a7c957" stroke-width="2.5" opacity=".8">
    <path d="M200 250 H740 M200 310 H740 M200 370 H740 M200 430 H740 M200 490 H740"/>
    <path d="M290 196 V543 M380 196 V543 M470 196 V543 M560 196 V543 M650 196 V543"/>
  </g>

  <!-- permukaan air + buih flok -->
  <path d="M214 246 q34 -16 68 0 t68 0 t68 0 t68 0 t68 0 t68 0 t54 0"
        fill="none" stroke="#bfe3ef" stroke-width="6" stroke-linecap="round"/>
  <g fill="#e8f3ee" opacity=".55">
    <ellipse cx="300" cy="240" rx="34" ry="8"/>
    <ellipse cx="470" cy="236" rx="46" ry="9"/>
    <ellipse cx="620" cy="242" rx="30" ry="7"/>
  </g>

  <!-- partikel flok -->
  <g fill="#a7c957" opacity=".55">
    <circle cx="262" cy="300" r="6"/><circle cx="318" cy="352" r="4"/>
    <circle cx="372" cy="292" r="7"/><circle cx="426" cy="392" r="5"/>
    <circle cx="486" cy="316" r="6"/><circle cx="540" cy="386" r="4"/>
    <circle cx="592" cy="304" r="7"/><circle cx="646" cy="360" r="5"/>
    <circle cx="286" cy="430" r="5"/><circle cx="398" cy="462" r="6"/>
    <circle cx="512" cy="452" r="4"/><circle cx="628" cy="440" r="6"/>
    <circle cx="690" cy="330" r="5"/><circle cx="342" cy="410" r="4"/>
    <circle cx="452" cy="352" r="4"/><circle cx="568" cy="332" r="5"/>
  </g>

  <!-- ikan nila -->
  <use href="#nila" transform="translate(340 336) rotate(-8)"/>
  <use href="#nila" transform="translate(560 392) rotate(6) scale(.92)"/>
  <use href="#nila" transform="translate(452 456) rotate(-4) scale(.84)"/>
  <use href="#nila" transform="translate(640 288) rotate(10) scale(.78)"/>

  <!-- batu aerasi + gelembung -->
  <g fill="#1d2b31">
    <rect x="300" y="500" width="58" height="16" rx="8"/>
    <rect x="582" y="500" width="58" height="16" rx="8"/>
  </g>
  <g fill="#ffffff" opacity=".7">
    <circle cx="312" cy="474" r="5"/><circle cx="330" cy="446" r="4"/>
    <circle cx="346" cy="410" r="6"/><circle cx="322" cy="376" r="4"/>
    <circle cx="340" cy="332" r="5"/><circle cx="318" cy="292" r="4"/>
    <circle cx="596" cy="472" r="5"/><circle cx="614" cy="440" r="4"/>
    <circle cx="628" cy="404" r="6"/><circle cx="606" cy="366" r="4"/>
    <circle cx="622" cy="322" r="5"/><circle cx="600" cy="284" r="4"/>
  </g>

  <!-- pipa udara dari blower -->
  <path d="M470 500 V536 H812" fill="none" stroke="#e6eef0" stroke-width="9"
        stroke-linecap="round" opacity=".9"/>
  <path d="M300 508 H470 M640 508 H470" fill="none" stroke="#e6eef0"
        stroke-width="7" stroke-linecap="round" opacity=".9"/>

  <!-- blower -->
  <rect x="812" y="470" width="104" height="76" rx="12" fill="#4a7c59"/>
  <circle cx="864" cy="508" r="24" fill="#e6f2e4"/>
  <g fill="#4a7c59">
    <path d="M864 490 q12 12 0 18 q-12 -6 0 -18"/>
    <path d="M882 517 q-16 4 -16 -9 q13 -2 16 9"/>
    <path d="M846 517 q3 -11 16 -9 q0 13 -16 9"/>
  </g>

  <!-- pembuangan sentral -->
  <path d="M470 546 V596 H600" fill="none" stroke="#8b98a0" stroke-width="12"
        stroke-linecap="round"/>

  <!-- label -->
  <g font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="19"
     fill="#2c3e2d">
    <g stroke="#7fb069" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M470 84 L470 40 L640 40"/>
      <path d="M206 226 L120 226 L120 200"/>
      <path d="M470 300 L120 300"/>
      <path d="M300 508 L118 470"/>
      <path d="M864 466 L864 438"/>
      <path d="M560 596 L700 596"/>
    </g>
    <g fill="#7fb069">
      <circle cx="470" cy="84" r="5"/><circle cx="206" cy="226" r="5"/>
      <circle cx="470" cy="300" r="5"/><circle cx="300" cy="508" r="5"/>
      <circle cx="864" cy="466" r="5"/><circle cx="560" cy="596" r="5"/>
    </g>
    <text x="650" y="46" font-weight="600">Atap paranet peneduh</text>
    <text x="104" y="188" text-anchor="end" font-weight="600">Rangka wiremesh</text>
    <text x="104" y="212" text-anchor="end" fill="#6b7280" font-size="16">+ terpal HDPE</text>
    <text x="108" y="294" text-anchor="end" font-weight="600">Air + flok</text>
    <text x="108" y="318" text-anchor="end" fill="#6b7280" font-size="16">koloni bakteri</text>
    <text x="104" y="464" text-anchor="end" font-weight="600">Batu aerasi</text>
    <text x="104" y="488" text-anchor="end" fill="#6b7280" font-size="16">nyala 24 jam</text>
    <text x="864" y="428" text-anchor="middle" font-weight="600">Blower / aerator</text>
    <text x="710" y="602" font-weight="600">Pembuangan sentral</text>
  </g>
</svg>
