<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 552" width="808" height="552" role="img" aria-labelledby="jdl des">
  <title id="jdl">Mengarahkan pertumbuhan tanaman</title>
  <desc id="des">Timbangan antara pertumbuhan vegetatif dan generatif beserta tuas pengubahnya.</desc>
  <style>
    .j  { font: 700 19px 'Poppins', 'Segoe UI', sans-serif; fill: #2d5a27; }
    .s  { font: 600 13px 'Poppins', 'Segoe UI', sans-serif; fill: #4a7c59; }
    .l  { font: 500 11.5px 'Poppins', 'Segoe UI', sans-serif; fill: #2c3e2d; }
    .k  { font: 500 10px 'Poppins', 'Segoe UI', sans-serif; fill: #6b7280; }
    .tebal { font-weight: 700; }
  </style>
  <rect width="808" height="552" fill="#f8fffe" rx="14"/>
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a90d9"/></marker><marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d5a27"/></marker><marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
<text x="30" y="40" class="j">Membaca dan Mengarahkan Tanaman</text><text x="30" y="62" class="l">Tanaman buah selalu condong ke salah satu sisi. Tugas Anda membacanya lebih dulu, baru mendorongnya kembali ke tengah.</text><path d="M404 108 L404 150" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/><path d="M150 130 L658 130" stroke="#2d5a27" stroke-width="5" stroke-linecap="round"/><circle cx="404" cy="130" r="9" fill="#2d5a27"/><text x="404" y="102" class="s" text-anchor="middle">Seimbang, sasaran yang dituju</text><line x1="196" y1="130" x2="196" y2="164" stroke="#6b7280" stroke-width="1.6"/><rect x="81" y="164" width="230" height="140" rx="12" fill="#fff" stroke="#7fb069" stroke-width="1.8"/><rect x="81" y="164" width="230" height="30" rx="12" fill="#7fb069"/><rect x="81" y="182" width="230" height="12" fill="#7fb069"/><text x="196" y="185" text-anchor="middle" style="font:700 14px Poppins,sans-serif;fill:#fff">Vegetatif</text><circle cx="100" cy="213" r="2.8" fill="#7fb069"/><text x="110" y="217" class="k">Ruas batang panjang</text><circle cx="100" cy="231" r="2.8" fill="#7fb069"/><text x="110" y="235" class="k">Batang tebal</text><circle cx="100" cy="249" r="2.8" fill="#7fb069"/><text x="110" y="253" class="k">Daun besar, hijau muda</text><circle cx="100" cy="267" r="2.8" fill="#7fb069"/><text x="110" y="271" class="k">Bunga dan buah sedikit</text><circle cx="100" cy="285" r="2.8" fill="#7fb069"/><text x="110" y="289" class="k">EC akar rendah, di bawah 2,0</text><line x1="612" y1="130" x2="612" y2="164" stroke="#6b7280" stroke-width="1.6"/><rect x="497" y="164" width="230" height="140" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="1.8"/><rect x="497" y="164" width="230" height="30" rx="12" fill="#f59e0b"/><rect x="497" y="182" width="230" height="12" fill="#f59e0b"/><text x="612" y="185" text-anchor="middle" style="font:700 14px Poppins,sans-serif;fill:#fff">Generatif</text><circle cx="516" cy="213" r="2.8" fill="#f59e0b"/><text x="526" y="217" class="k">Ruas batang pendek</text><circle cx="516" cy="231" r="2.8" fill="#f59e0b"/><text x="526" y="235" class="k">Batang tipis</text><circle cx="516" cy="249" r="2.8" fill="#f59e0b"/><text x="526" y="253" class="k">Daun kecil, hijau tua</text><circle cx="516" cy="267" r="2.8" fill="#f59e0b"/><text x="526" y="271" class="k">Bunga dan buah banyak</text><circle cx="516" cy="285" r="2.8" fill="#f59e0b"/><text x="526" y="289" class="k">EC akar tinggi, di atas 2,5</text><text x="30" y="342" class="s">Kalau tanaman terlalu vegetatif, dorong ke generatif</text><circle cx="44" cy="364" r="3.2" fill="#f59e0b"/><text x="56" y="368" class="l">Naikkan EC larutan</text><circle cx="44" cy="383" r="3.2" fill="#f59e0b"/><text x="56" y="387" class="l">Perbesar rasio K dan P terhadap N</text><circle cx="44" cy="402" r="3.2" fill="#f59e0b"/><text x="56" y="406" class="l">Kurangi volume air tiap siklus</text><circle cx="44" cy="421" r="3.2" fill="#f59e0b"/><text x="56" y="425" class="l">Kurangi frekuensi fertigasi harian</text><circle cx="44" cy="440" r="3.2" fill="#f59e0b"/><text x="56" y="444" class="l">Rutinkan buang tunas air</text><circle cx="44" cy="459" r="3.2" fill="#f59e0b"/><text x="56" y="463" class="l">Buang daun bawah tepat waktu</text><text x="410" y="342" class="s">Kalau terlalu generatif, dorong ke vegetatif</text><circle cx="424" cy="364" r="3.2" fill="#7fb069"/><text x="436" y="368" class="l">Turunkan EC larutan</text><circle cx="424" cy="383" r="3.2" fill="#7fb069"/><text x="436" y="387" class="l">Perbesar rasio N terhadap K dan P</text><circle cx="424" cy="402" r="3.2" fill="#7fb069"/><text x="436" y="406" class="l">Perbesar volume air tiap siklus</text><circle cx="424" cy="421" r="3.2" fill="#7fb069"/><text x="436" y="425" class="l">Perbanyak frekuensi fertigasi harian</text><circle cx="424" cy="440" r="3.2" fill="#7fb069"/><text x="436" y="444" class="l">Tunda pembuangan tunas air</text><circle cx="424" cy="459" r="3.2" fill="#7fb069"/><text x="436" y="463" class="l">Jangan dulu buang daun bawah</text><rect x="30" y="486" width="748" height="46" rx="10" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><text x="50" y="506" class="s">Ubah satu tuas saja setiap kali</text><text x="50" y="524" class="l">Tanaman butuh lima sampai tujuh hari untuk menjawab. Mengubah banyak hal sekaligus membuat Anda tidak tahu mana yang bekerja.</text></svg>
