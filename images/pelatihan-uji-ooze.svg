<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 396" width="808" height="396" role="img" aria-labelledby="jdl des">
  <title id="jdl">Uji ooze</title>
  <desc id="des">Perbandingan hasil uji ooze pada layu jamur dan layu bakteri.</desc>
  <style>
    .j  { font: 700 19px 'Poppins', 'Segoe UI', sans-serif; fill: #2d5a27; }
    .s  { font: 600 13px 'Poppins', 'Segoe UI', sans-serif; fill: #4a7c59; }
    .l  { font: 500 11.5px 'Poppins', 'Segoe UI', sans-serif; fill: #2c3e2d; }
    .k  { font: 500 10px 'Poppins', 'Segoe UI', sans-serif; fill: #6b7280; }
    .tebal { font-weight: 700; }
  </style>
  <rect width="808" height="396" fill="#f8fffe" rx="14"/>
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a90d9"/></marker><marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d5a27"/></marker><marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
<text x="30" y="40" class="j">Uji Ooze, Membedakan Layu Bakteri dan Layu Jamur</text><text x="30" y="62" class="l">Cukup segelas air bening. Potong batang yang layu, gantung ujungnya di dalam air, lalu diamkan lima sampai sepuluh menit.</text><rect x="70" y="92" width="308" height="230" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><text x="92" y="118" class="s" style="fill:#4a7c59">Layu jamur (Fusarium)</text><path d="M172 140 L180 288 Q180 300 190 300 L258 300 Q268 300 268 288 L276 140 Z" fill="#fff" stroke="#6b7280" stroke-width="2"/><path d="M176 170 L181 288 Q181 298 190 298 L258 298 Q267 298 267 288 L272 170 Z" fill="#bcdcf5" opacity="0.55"/><rect x="217" y="126" width="14" height="86" rx="3" fill="#7fb069"/><rect x="217" y="126" width="14" height="10" rx="3" fill="#4a7c59"/><text x="224" y="316" class="k" text-anchor="middle">air tetap bening, tidak ada benang</text><text x="224" y="340" class="k" text-anchor="middle" style="fill:#4a7c59;font-weight:700">Fungisida masih bisa menolong</text><rect x="430" y="92" width="308" height="230" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="452" y="118" class="s" style="fill:#dc2626">Layu bakteri (Ralstonia)</text><path d="M532 140 L540 288 Q540 300 550 300 L618 300 Q628 300 628 288 L636 140 Z" fill="#fff" stroke="#6b7280" stroke-width="2"/><path d="M536 170 L541 288 Q541 298 550 298 L618 298 Q627 298 627 288 L632 170 Z" fill="#bcdcf5" opacity="0.55"/><rect x="577" y="126" width="14" height="86" rx="3" fill="#7fb069"/><rect x="577" y="126" width="14" height="10" rx="3" fill="#4a7c59"/><path d="M584 212 C 578 238, 588 252, 582 276" stroke="#94a3b8" stroke-width="8.5" fill="none" stroke-linecap="round"/><path d="M584 212 C 578 238, 588 252, 582 276" stroke="#ffffff" stroke-width="6.0" fill="none" stroke-linecap="round"/><path d="M588 212 C 582 238, 590 252, 594 286" stroke="#94a3b8" stroke-width="5.0" fill="none" stroke-linecap="round"/><path d="M588 212 C 582 238, 590 252, 594 286" stroke="#ffffff" stroke-width="3.0" fill="none" stroke-linecap="round"/><line x1="600" y1="250" x2="646" y2="250" stroke="#dc2626" stroke-width="1.4"/><text x="604" y="246" class="k" style="fill:#dc2626;font-weight:700">benang lendir</text><text x="584" y="316" class="k" text-anchor="middle">turun perlahan dari potongan batang</text><text x="584" y="340" class="k" text-anchor="middle" style="fill:#dc2626;font-weight:700">Musnahkan tanaman, jangan pakai ulang media</text><text x="30" y="376" class="l">Bedanya penting karena penanganannya berlawanan. Layu bakteri tidak bisa disembuhkan fungisida, dan menyebar lewat air serta alat potong.</text></svg>
