<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 366" width="798" height="366" role="img" aria-labelledby="jdl des">
  <title id="jdl">Sanitasi greenhouse</title>
  <desc id="des">Empat kebiasaan sanitasi yang memutus penyebaran penyakit.</desc>
  <style>
    .j  { font: 700 19px 'Poppins', 'Segoe UI', sans-serif; fill: #2d5a27; }
    .s  { font: 600 13px 'Poppins', 'Segoe UI', sans-serif; fill: #4a7c59; }
    .l  { font: 500 11.5px 'Poppins', 'Segoe UI', sans-serif; fill: #2c3e2d; }
    .k  { font: 500 10px 'Poppins', 'Segoe UI', sans-serif; fill: #6b7280; }
    .tebal { font-weight: 700; }
  </style>
  <rect width="798" height="366" fill="#f8fffe" rx="14"/>
  <defs><marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a90d9"/></marker><marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d5a27"/></marker><marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
<text x="30" y="40" class="j">Sanitasi, Pertahanan yang Paling Murah</text><text x="30" y="62" class="l">Sebagian besar wabah masuk lewat sepatu, tangan, dan gunting, bukan lewat udara. Empat kebiasaan ini memutus jalannya.</text><rect x="30" y="88" width="176" height="196" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><circle cx="118" cy="132" r="26" fill="#7fb069" opacity="0.16"/><rect x="95" y="122" width="46" height="22" rx="4" fill="#bcdcf5"/><path d="M106 122 L106 112 L122 108 L122 118 Z" fill="#2d5a27"/><text x="118" y="182" class="s" text-anchor="middle">Bak celup sepatu</text><text x="118" y="206" class="k" text-anchor="middle">Di setiap pintu masuk.</text><text x="118" y="221" class="k" text-anchor="middle">Larutan diganti berkala,</text><text x="118" y="236" class="k" text-anchor="middle">bukan hanya ditambah.</text><rect x="222" y="88" width="176" height="196" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><circle cx="310" cy="132" r="26" fill="#7fb069" opacity="0.16"/><path d="M300 118 L318 140 M320 118 L302 140" stroke="#2d5a27" stroke-width="3.4" stroke-linecap="round"/><circle cx="300" cy="144" r="4.5" fill="none" stroke="#2d5a27" stroke-width="2.6"/><circle cx="320" cy="144" r="4.5" fill="none" stroke="#2d5a27" stroke-width="2.6"/><text x="310" y="182" class="s" text-anchor="middle">Alat potong disterilkan</text><text x="310" y="206" class="k" text-anchor="middle">Gunting dicelup sebelum</text><text x="310" y="221" class="k" text-anchor="middle">pindah tanaman. Satu gunting</text><text x="310" y="236" class="k" text-anchor="middle">kotor bisa menulari satu baris.</text><rect x="414" y="88" width="176" height="196" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><circle cx="502" cy="132" r="26" fill="#7fb069" opacity="0.16"/><rect x="482" y="120" width="40" height="26" rx="5" fill="#c89b7b"/><path d="M478 116 L526 150 M526 116 L478 150" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round"/><text x="502" y="182" class="s" text-anchor="middle">Media tidak dipakai ulang</text><text x="502" y="206" class="k" text-anchor="middle">Terutama bila pernah ada</text><text x="502" y="221" class="k" text-anchor="middle">layu bakteri. Sterilkan atau</text><text x="502" y="236" class="k" text-anchor="middle">buang sama sekali.</text><rect x="606" y="88" width="176" height="196" rx="12" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><circle cx="694" cy="132" r="26" fill="#7fb069" opacity="0.16"/><path d="M678 120 L682 148 L706 148 L710 120 Z" fill="none" stroke="#2d5a27" stroke-width="2.4"/><rect x="674" y="114" width="40" height="6" rx="3" fill="#2d5a27"/><text x="694" y="182" class="s" text-anchor="middle">Sisa tanaman dibuang jauh</text><text x="694" y="206" class="k" text-anchor="middle">Daun dan buah afkir tidak</text><text x="694" y="221" class="k" text-anchor="middle">boleh menumpuk di dalam</text><text x="694" y="236" class="k" text-anchor="middle">greenhouse.</text><rect x="30" y="300" width="738" height="46" rx="10" fill="#fff" stroke="#d7e4d9" stroke-width="1.5"/><text x="50" y="320" class="s">Aturan yang paling sering dilanggar</text><text x="50" y="338" class="l">Menengok kebun tetangga lalu langsung masuk greenhouse sendiri. Ganti alas kaki, atau setidaknya lewati bak celup.</text></svg>
