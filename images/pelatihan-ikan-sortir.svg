<text x="30" y="40" class="j">Sortir Memisahkan yang Besar dari yang Kecil</text><text x="30" y="62" class="l">Tanpa sortir, yang besar mengambil jatah pakan yang kecil, dan pada lele bahkan memangsanya.</text><rect x="30" y="94" width="330" height="180" rx="12" fill="#fff" stroke="#fecaca" stroke-width="1.6"/><text x="52" y="120" class="s" style="fill:#dc2626">Tanpa sortir</text><g transform="translate(96.0,156.0) scale(1.00,1)"><path d="M-15.0 0 C -6.0 -7.8, 6.0 -7.8, 15.0 0 C 6.0 7.8, -6.0 7.8, -15.0 0 Z" fill="#c89b7b"/><path d="M-13.8 0 L-21.6 -6.3 L-21.6 6.3 Z" fill="#c89b7b"/><circle cx="9.0" cy="-2.0" r="1.5" fill="#fff"/></g><g transform="translate(170.0,148.0) scale(1.00,1)"><path d="M-31.0 0 C -12.4 -16.1, 12.4 -16.1, 31.0 0 C 12.4 16.1, -12.4 16.1, -31.0 0 Z" fill="#7fb069"/><path d="M-28.5 0 L-44.6 -13.0 L-44.6 13.0 Z" fill="#7fb069"/><circle cx="18.6" cy="-4.2" r="3.1" fill="#fff"/></g><g transform="translate(250.0,162.0) scale(1.00,1)"><path d="M-20.0 0 C -8.0 -10.4, 8.0 -10.4, 20.0 0 C 8.0 10.4, -8.0 10.4, -20.0 0 Z" fill="#c89b7b"/><path d="M-18.4 0 L-28.8 -8.4 L-28.8 8.4 Z" fill="#c89b7b"/><circle cx="12.0" cy="-2.7" r="2.0" fill="#fff"/></g><g transform="translate(312.0,150.0) scale(1.00,1)"><path d="M-11.0 0 C -4.4 -5.7, 4.4 -5.7, 11.0 0 C 4.4 5.7, -4.4 5.7, -11.0 0 Z" fill="#c89b7b"/><path d="M-10.1 0 L-15.8 -4.6 L-15.8 4.6 Z" fill="#c89b7b"/><circle cx="6.6" cy="-1.5" r="1.1" fill="#fff"/></g><g transform="translate(110.0,210.0) scale(1.00,1)"><path d="M-35.0 0 C -14.0 -18.2, 14.0 -18.2, 35.0 0 C 14.0 18.2, -14.0 18.2, -35.0 0 Z" fill="#7fb069"/><path d="M-32.2 0 L-50.4 -14.7 L-50.4 14.7 Z" fill="#7fb069"/><circle cx="21.0" cy="-4.7" r="3.5" fill="#fff"/></g><g transform="translate(200.0,206.0) scale(1.00,1)"><path d="M-13.0 0 C -5.2 -6.8, 5.2 -6.8, 13.0 0 C 5.2 6.8, -5.2 6.8, -13.0 0 Z" fill="#c89b7b"/><path d="M-12.0 0 L-18.7 -5.5 L-18.7 5.5 Z" fill="#c89b7b"/><circle cx="7.8" cy="-1.7" r="1.3" fill="#fff"/></g><g transform="translate(272.0,2