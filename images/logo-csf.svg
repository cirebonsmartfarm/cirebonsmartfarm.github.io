<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Logo Cirebon Smart Farm">
  <title>Cirebon Smart Farm</title>

  <defs>
    <clipPath id="dalam">
      <circle cx="256" cy="256" r="208"/>
    </clipPath>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFBF2"/>
      <stop offset="1" stop-color="#FBF1DC"/>
    </linearGradient>
    <linearGradient id="daunTerang" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BD44A"/>
      <stop offset="1" stop-color="#4CAF3F"/>
    </linearGradient>
    <linearGradient id="daunGelap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57B640"/>
      <stop offset="1" stop-color="#2E8B32"/>
    </linearGradient>
  </defs>

  <!-- piringan dalam -->
  <circle cx="256" cy="256" r="208" fill="url(#langit)"/>

  <!-- hamparan ladang berteras -->
  <g clip-path="url(#dalam)">
    <path d="M20 352 Q140 300 256 336 Q372 372 492 320 L492 470 L20 470 Z" fill="#FFC42B"/>
    <path d="M20 384 Q140 336 256 370 Q372 404 492 356 L492 470 L20 470 Z" fill="#F99B1F"/>
    <path d="M20 414 Q140 370 256 402 Q372 434 492 392 L492 470 L20 470 Z" fill="#F1741D"/>
    <path d="M20 442 Q140 404 256 432 Q372 460 492 424 L492 470 L20 470 Z" fill="#E5551B"/>

    <!-- alur bajak -->
    <g fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round">
      <path d="M28 366 Q142 316 256 350"/>
      <path d="M256 350 Q372 386 486 336"/>
      <path d="M28 398 Q142 350 256 384"/>
      <path d="M256 384 Q372 418 486 370"/>
      <path d="M28 428 Q142 386 256 416"/>
      <path d="M256 416 Q372 448 486 406"/>
    </g>

    <!-- gundukan tanah tempat tunas tumbuh -->
    <ellipse cx="256" cy="356" rx="62" ry="20" fill="#C8531A" opacity=".55"/>
  </g>

  <!-- tunas -->
  <g>
    <!-- batang -->
    <path d="M256 358 C252 300 252 246 256 196" stroke="#2E8B32" stroke-width="13"
          stroke-linecap="round" fill="none"/>

    <!-- sepasang daun bawah -->
    <path d="M252 300 C206 300 172 274 164 240 C204 230 244 254 252 300 Z" fill="url(#daunGelap)"/>
    <path d="M260 286 C300 282 330 256 336 224 C300 218 266 242 260 286 Z" fill="url(#daunTerang)"/>

    <!-- sepasang daun tengah -->
    <path d="M252 244 C210 240 182 214 178 182 C216 176 246 200 252 244 Z" fill="url(#daunTerang)"/>
    <path d="M260 228 C300 220 326 192 328 160 C292 156 264 184 260 228 Z" fill="url(#daunGelap)"/>

    <!-- daun puncak -->
    <path d="M256 196 C230 178 218 146 226 116 C256 126 270 160 256 196 Z" fill="url(#daunTerang)"/>
    <path d="M258 190 C286 172 300 140 292 110 C262 120 246 154 258 190 Z" fill="url(#daunGelap)"/>

    <!-- tulang daun tipis -->
    <g stroke="#ffffff" stroke-opacity=".38" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M248 292 C222 286 200 268 186 246"/>
      <path d="M266 278 C290 270 310 252 322 232"/>
      <path d="M250 238 C226 230 208 210 200 190"/>
      <path d="M264 220 C286 210 302 190 310 170"/>
      <path d="M252 188 C240 168 236 146 240 126"/>
      <path d="M262 182 C276 164 284 142 282 122"/>
    </g>
  </g>

  <!-- cincin biru -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#1667C4" stroke-width="28"/>
</svg>
