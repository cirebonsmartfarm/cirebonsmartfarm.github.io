<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="a4j a4d">
  <title id="a4j">Ukur EC dan pH</title>
  <desc id="a4d">EC dan pH diukur setelah larutan benar-benar tercampur, lalu dibandingkan
    dengan sasaran tanaman.</desc>
  <rect width="420" height="300" rx="14" fill="#f4f9f2"/>
  <text x="210" y="36" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#2d5a27" text-anchor="middle">Ukur setelah tercampur rata</text>

  <g transform="translate(64 54)">
    <rect width="104" height="146" rx="16" fill="#31414a"/>
    <rect x="12" y="14" width="80" height="50" rx="8" fill="#c9e8b8"/>
    <text x="52" y="40" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f3f1c" text-anchor="middle">EC</text>
    <text x="52" y="58" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#2d5a27" text-anchor="middle">1.0</text>
    <g fill="#5b6b74"><rect x="16" y="78" width="30" height="17" rx="5"/><rect x="58" y="78" width="30" height="17" rx="5"/>
      <rect x="16" y="102" width="30" height="17" rx="5"/><rect x="58" y="102" width="30" height="17" rx="5"/></g>
    <rect x="42" y="146" width="20" height="60" rx="7" fill="#5b6b74"/>
    <rect x="46" y="198" width="12" height="20" rx="5" fill="#a7c957"/>
  </g>

  <g transform="translate(238 54)">
    <rect width="104" height="146" rx="16" fill="#31414a"/>
    <rect x="12" y="14" width="80" height="50" rx="8" fill="#ffe0b2"/>
    <text x="52" y="40" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#7a4a10" text-anchor="middle">pH</text>
    <text x="52" y="58" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#a8480b" text-anchor="middle">6.0</text>
    <g fill="#5b6b74"><rect x="16" y="78" width="30" height="17" rx="5"/><rect x="58" y="78" width="30" height="17" rx="5"/>
      <rect x="16" y="102" width="30" height="17" rx="5"/><rect x="58" y="102" width="30" height="17" rx="5"/></g>
    <rect x="42" y="146" width="20" height="60" rx="7" fill="#5b6b74"/>
    <rect x="46" y="198" width="12" height="20" rx="5" fill="#e0a83c"/>
  </g>

  <path d="M40 226 H380 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 H40 a10 10 0 0 1 -10 -10 v-20 a10 10 0 0 1 10 -10 Z" fill="#5fa8bf" opacity=".55"/>
  <path d="M36 230 q18 -8 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0" fill="none" stroke="#cdeaf4" stroke-width="4" stroke-linecap="round"/>

  <text x="210" y="290" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Bandingkan dengan sasaran tanaman Anda</text>
</svg>
