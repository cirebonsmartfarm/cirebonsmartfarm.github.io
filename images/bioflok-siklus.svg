<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"
     aria-labelledby="judulSiklus descSiklus">
  <title id="judulSiklus">Siklus nitrogen dalam sistem bioflok</title>
  <desc id="descSiklus">Pakan diberikan ke ikan, sisa pakan dan kotoran melepas amonia,
    penambahan sumber karbon memicu bakteri heterotrof mengubah amonia menjadi protein flok,
    dan flok itu dimakan kembali oleh ikan sehingga siklus tertutup.</desc>

  <defs>
    <marker id="panah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8"
            markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#7fb069"/>
    </marker>
    <style>
      .kartu { fill: #ffffff; stroke: #dbe8dc; stroke-width: 2; }
      .no    { fill: #2d5a27; }
      .noTxt { fill: #ffffff; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .jdl   { fill: #2c3e2d; font-size: 21px; font-weight: 600; text-anchor: middle; }
      .sub   { fill: #6b7280; font-size: 16px; text-anchor: middle; }
      text   { font-family: Poppins, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f8fffe"/>

  <!-- alur melingkar -->
  <g fill="none" stroke="#7fb069" stroke-width="5" stroke-linecap="round"
     marker-end="url(#panah)">
    <path d="M531.2 163.3 A150 150 0 0 1 629.9 235"/>
    <path d="M649.2 294.3 A150 150 0 0 1 611.5 410.4"/>
    <path d="M561 447 A150 150 0 0 1 439 447"/>
    <path d="M388.5 410.4 A150 150 0 0 1 350.8 294.3"/>
    <path d="M370.1 235 A150 150 0 0 1 468.8 163.3"/>
  </g>

  <!-- inti -->
  <circle cx="500" cy="310" r="80" fill="#2d5a27"/>
  <text x="500" y="296" fill="#a7c957" font-size="16" font-weight="600"
        text-anchor="middle">RASIO C : N</text>
  <text x="500" y="330" fill="#ffffff" font-size="27" font-weight="700"
        text-anchor="middle">15–20 : 1</text>
  <text x="500" y="354" fill="#cfe3d8" font-size="14" text-anchor="middle">dijaga harian</text>

  <!-- 1 pakan -->
  <rect class="kartu" x="395" y="59" width="210" height="92" rx="14"/>
  <circle class="no" cx="395" cy="105" r="19"/>
  <text class="noTxt" x="395" y="112">1</text>
  <text class="jdl" x="503" y="99">Pakan pelet</text>
  <text class="sub" x="503" y="124">protein 28–30%</text>

  <!-- 2 ikan -->
  <rect class="kartu" x="590" y="201" width="210" height="92" rx="14"/>
  <circle class="no" cx="590" cy="247" r="19"/>
  <text class="noTxt" x="590" y="254">2</text>
  <text class="jdl" x="698" y="241">Ikan nila</text>
  <text class="sub" x="698" y="266">menyerap ± 25% N</text>

  <!-- 3 amonia -->
  <rect class="kartu" x="515" y="430" width="210" height="92" rx="14"/>
  <circle class="no" cx="515" cy="476" r="19"/>
  <text class="noTxt" x="515" y="483">3</text>
  <text class="jdl" x="623" y="470">Amonia (TAN)</text>
  <text class="sub" x="623" y="495">dari sisa pakan &amp; kotoran</text>

  <!-- 4 karbon -->
  <rect class="kartu" x="275" y="430" width="210" height="92" rx="14"/>
  <circle class="no" cx="275" cy="476" r="19"/>
  <text class="noTxt" x="275" y="483">4</text>
  <text class="jdl" x="383" y="470">Sumber karbon</text>
  <text class="sub" x="383" y="495">molase, dedak, tepung tapioka</text>

  <!-- 5 flok -->
  <rect class="kartu" x="200" y="201" width="210" height="92" rx="14"/>
  <circle class="no" cx="200" cy="247" r="19"/>
  <text class="noTxt" x="200" y="254">5</text>
  <text class="jdl" x="308" y="241">Flok bakteri</text>
  <text class="sub" x="308" y="266">pakan alami, dimakan lagi</text>

  <!-- catatan bawah -->
  <text x="500" y="586" class="sub" font-size="17">
    Nitrogen tidak dibuang ke lingkungan, tetapi didaur ulang menjadi protein di dalam kolam.
  </text>
</svg>
